name: Build Android APK

# Builds an installable Android app (APK) in the cloud — no Android Studio needed.
# Run it: GitHub → Actions → "Build Android APK" → Run workflow. The APK appears under "Artifacts".
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install -g npm@11
          npm install --legacy-peer-deps

      - name: Create .env from repository secrets
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            echo "VITE_PUBLIC_WEB_URL="
          } > .env

      - name: Create the Android project (icon, name, permissions)
        run: npm run android:init

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kepatina-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
